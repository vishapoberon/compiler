schema = 1
package = "xml"
kind = "library"
origin = "Michael van Acken's ooc-libxml 3.2.0, ported to VOC Oberon-2"
upstream_url = "https://github.com/norayr/voc-ooc-xml"
upstream_revision = "894d92c7fb8005818ff02cbb89db67a4dde38d5f"
revision_status = "tested standalone port; original CVS history, branches and release tags preserved upstream"
voc_baseline = "c664ef40"
sources = ["XML*.Mod"]
license = "GNU LGPL-2.0-or-later; including the LGPL 2.1 text in COPYING and preserving per-file and third-party test data notices"
source_map = [
  "src/XML/UnicodeCodec.Mod -> XMLUnicodeCodec.Mod",
  "src/XML/UnicodeCodec/ASCII.Mod -> XMLUnicodeCodecASCII.Mod",
  "src/XML/UnicodeCodec/Latin1.Mod -> XMLUnicodeCodecLatin1.Mod",
  "src/XML/UnicodeCodec/UTF8.Mod -> XMLUnicodeCodecUTF8.Mod",
  "src/XML/UnicodeCodec/UTF16.Mod -> XMLUnicodeCodecUTF16.Mod",
  "src/XML/UnicodeCodec/ImportAll.Mod -> XMLUnicodeCodecImportAll.Mod",
  "src/XML/Limits.Mod -> XMLLimits.Mod",
  "src/XML/InputBuffer.Mod -> XMLInputBuffer.Mod",
  "src/XML/UnicodeBuffer.Mod -> XMLUnicodeBuffer.Mod",
  "src/XML/DTD.Mod -> XMLDTD.Mod",
  "src/XML/EntityResolver.Mod -> XMLEntityResolver.Mod",
  "src/XML/Error.Mod -> XMLError.Mod",
  "src/XML/Locator.Mod -> XMLLocator.Mod",
  "src/XML/Builder.Mod -> XMLBuilder.Mod",
  "src/XML/Parser.Mod -> XMLParser.Mod",
  "src/XML/Stream.Mod -> XMLStream.Mod (additive stream framing API)",
  "src/XML/Builder/Namespaces.Mod -> XMLBuilderNamespaces.Mod",
  "src/XML/Regexp.Mod -> XMLRegexp.Mod",
  "src/XML/Builder/Validation.Mod -> XMLBuilderValidation.Mod",
  "src/XML/Writer.Mod -> XMLWriter.Mod",
  "src/XML/Builder/Canonical.Mod -> XMLBuilderCanonical.Mod",
  "src/XML/Builder/ParserProtocol.Mod -> XMLBuilderParserProtocol.Mod",
  "src/XML/Basic/Element.Mod -> XMLBasicElement.Mod",
  "src/XML/Basic/DataType.Mod -> XMLBasicDataType.Mod",
  "src/XML/Basic/Parser.Mod -> XMLBasicParser.Mod",
  "src/TestCodecs.Mod -> tests/upstream/TestCodecs.Mod",
  "tools/XMLCheck.Mod, tests/voc/* -> same paths",
  "tests/3rd-party-archives, tests/{bulk,miscxml,namespaces,protocol}, tests/oasis/*.list -> same paths",
]
adaptations = [
  "adding bounded byte-fed XML element streams while preserving the existing parser and builder APIs",
  "flattening implementation paths while keeping all 24 tested implementation files byte-for-byte",
  "building against VOC's shared ooc Unicode, strings, diagnostics, channels, file/memory and URI modules",
  "adding model-2 conventional, modular and Windows library manifests and isolated regression targets",
  "adjusting the codec runner's preserved-driver path and documenting VOC build commands",
]
build = "make xml; make modular-library MODEL=2; make.cmd library; make -C src/ports/xml"
test = "make -C src/ports/xml test conformance limits fuzz; make confidence; make modular-library-test MODEL=2"
