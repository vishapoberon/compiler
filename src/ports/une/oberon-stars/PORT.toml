schema = 1
package = "oberon-stars"
kind = "mixed"
origin = "Carlos Une's star-position computation library and Star program"
upstream_url = "https://codeberg.org/une/oberon-stars"
upstream_revision = "2f012c78aef8caa10b0721f559a562aa374349ca"
revision_status = "pulled before import; integration changes committed separately"
voc_baseline = "6d07acac"
sources = ["Angle.Mod", "MathE.Mod", "Epoch.Mod", "Coordinate.Mod", "Precession.Mod", "Nutation.Mod", "JulianDay.Mod"]
source_map = ["*.mod library files -> *.Mod (filename case only)", "Star.mod -> src/examples/libraries/stars/Star.Mod", "COPYING and README.md -> same filenames"]
excluded_sources = ["JulianDay.Mod: retained unchanged, but not built; Star uses VOC's existing oo2c JulianDay module and Platform.GetTimeOfDay"]
license = "GPL-3.0, preserving per-file notices and COPYING; not relicensed"
adaptations = ["No library source changes; Star uses VOC's existing JulianDay and Platform instead of the upstream same-named module and separate time repository", "Keeping the GPL library out of the default conventional and modular runtime", "Keeping Star source-only, using bundled opts and ethStrings without fetching dependencies"]
native_libraries = ["c"]
build = "make -C src/examples/libraries/stars (opt-in; builds Star and private library objects)"
test = "make -C src/test/ports/une test"
