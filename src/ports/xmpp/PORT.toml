adaptations = [
  "recording Component Pascal widths explicitly for VOC's Oberon-2 model",
  "receiving byte-fed bounded stanzas through XMLStream and the namespace-aware ooc-xml parser",
  "replacing Xmlcore DOM coupling with UTF-16 stanza trees and checked ooc-xml output",
  "delivering transport-independent stream, stanza, feature and session events",
  "adding verified direct TLS and STARTTLS through VOC networking and TLS13Live.Start",
  "negotiating explicitly enabled SASL PLAIN, stream restarts and correlated resource binding",
  "routing bounded IQ requests with peer checks, deadlines, ping, version and service discovery",
  "adding bounded atomic rosters, sender-checked pushes and reusable PubSub/PEP operations",
  "adding bounded multilingual presence, explicit subscriptions and per-resource tracking",
  "adding bounded room-checked MUC stanzas, invitations, configuration and administration with exact-peer IQ matching",
  "tracking explicit room membership and occupants with bounded caches, reentrant deadlines and disconnect cleanup",
  "adding explicit TLS-verified pre-login registration and bounded legacy account/service registration changes",
  "adding bounded IQ-based IBB transfers, explicit consent, checked channel I/O, acknowledgement deadlines and cleanup",
  "preserving Unicode XML service identities while using shared IDNA conversion for DNS and TLS",
  "including portable modules in conventional, Windows and modular Oberon-2 library manifests",
  "preserving 88 original files, including all 31 native BlackBox documents and text exports",
]
