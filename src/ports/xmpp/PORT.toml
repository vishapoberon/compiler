original_revision = "a2cde5435bea63de16239c2c31e399ad0fd43ad2"
revision_status = "synchronized native room-state, registration and IBB transfer revision; original snapshot preserved"
license = "not specified in supplied subsystem; confirmation pending"
sources = ["Xmpp*.Mod"]
build = "make xmpp; make -C src/ports/xmpp network"
test = "make -C src/ports/xmpp test"
