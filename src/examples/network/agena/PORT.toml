schema = 1
package = "agena"
origin = "Norayr Chilingarian's Polpo Gemini server"
upstream_url = "https://github.com/polpo-system/agena"
upstream_revision = "d3bfb6197b00425dd6a5bc93fd5cf640267f5eca"
sources = ["agena.Mod", "agenaMain.Mod"]
adaptation_date = "2026-10-15"
license = "upstream GPL version 3 in LICENSE"
source_map = ["agena.Mod -> agena.Mod", "LICENSE -> LICENSE", "test/* -> src/test/ports/agena/ (original Polpo tests and public fixtures)", "VOC-local agenaMain.Mod -> standalone argv wrapper"]
adaptations = ["aliasing Linux0 := unixNet, out := Out, and Texts := PortArgs", "using NetHost for metadata and enumeration instead of FATFiles", "using VOC Files.Close/garbage-collected descriptor lifetime rather than Polpo ReleaseRead", "using VOC Oberon.OnStop cleanup for optional hresh commands", "retaining one-connection-at-a-time serving and the non-constant-time TLS warning", "not claiming symlink/concurrent-path confinement or production security auditing", "building only on request, on Linux in model 2"]
build = "make -C src/examples/network/agena; make -C src/examples/network/agena native (optional hresh)"
test = "make -C src/examples/network/agena test (VOC loopback harness; original Polpo child-process tests retained for reference)"
